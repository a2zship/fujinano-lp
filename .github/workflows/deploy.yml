name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bản xem mẫu tĩnh (không backend). Tên repo = base path.
      STATIC_EXPORT: '1'
      PAGES_BASE_PATH: /fujinano-lp
      NEXT_PUBLIC_DEMO_MODE: 'true'
      NEXT_PUBLIC_SITE_URL: https://a2zship.github.io/fujinano-lp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Enable GitHub Pages (source = Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        run: npm ci

      - name: Remove server-only API (Pages is static-only)
        run: rm -rf app/api

      - name: Build static export
        run: npx next build

      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
